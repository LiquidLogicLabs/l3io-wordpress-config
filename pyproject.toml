[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "l3io-wordpress-config"
dynamic = ["version"]
description = "Read and write define() constants in a WordPress wp-config.php file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shawn Anderson" }]
keywords = ["wordpress", "wp-config", "configuration", "php"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

# AD-2: zero runtime dependencies, permanently. This list must stay empty.
# Anything needed by two packages moves down here only if it arrives
# dependency-free; otherwise it is duplicated deliberately and recorded.
dependencies = []

[project.scripts]
l3io-wordpress-config = "l3io.wp.config.cli.main:main"

[project.urls]
Homepage = "https://github.com/LiquidLogicLabs/l3io-wordpress-config"
Repository = "https://github.com/LiquidLogicLabs/l3io-wordpress-config"

# PEP 735. Not published, so AD-2's zero-dependency promise holds in the
# distributed metadata and not merely at runtime.
[dependency-groups]
dev = [
    "ruff==0.16.7",          # pinned exactly: pre-1.0, per shared context
    "mypy>=2.3.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    # The contract tests read the workflow files. A maintained parser, because the
    # one thing this repo's rules will not tolerate is a hand-written YAML parser.
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
    # tests/test_declared_facts.py compares requires-python with the classifiers.
    # Declared directly, at the version already locked through pytest, rather than
    # imported transitively and lost when pytest stops needing it.
    "packaging==26.3",
    # Property tests for value spans (ADR-0010): generated values whose true
    # reading is known, since read-back re-scans with the same patterns it checks.
    "hypothesis>=6.169.0,<7.0.0",
]

# AD-27: the wheel ships the l3io/ and l3io/wp/ directories WITHOUT __init__.py
# markers, so l3io.wp stays a PEP 420 native namespace. Adding an __init__.py at
# either level makes this a regular package and makes its siblings unimportable.
# The lockfile must be generated by the same uv CI uses. A lock written by a
# different uv can resolve differently and fail `uv sync --locked` in CI while
# passing locally -- a failure that only appears on the machine you cannot debug.
# Pinned exactly, and enforced here rather than documented, so a mismatched uv
# fails loudly instead of silently writing a divergent lock.
[tool.uv]
required-version = "==0.11.6"

[tool.hatch.version]
# AD-30: the git tag IS the version. There is no literal anywhere in this repo
# to drift from it -- not in pyproject, not in the package -- so "keep the tag
# and the package in sync" is not a rule anyone can break.
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI rejects local version labels, so a dev build must not carry +g<sha>.
local_scheme = "no-local-version"
# Three-component tags only. setuptools-scm reads a two-component tag's
# components and guesses the next MINOR, so a commit descending from a tag such
# as `v1.0` would build a version that sorts out of order with the real releases.
# With the match, only three-component release tags are candidates.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[tool.hatch.build.targets.wheel]
packages = ["src/l3io"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# BMad tooling and harness directories are vendored, not project code.
extend-exclude = ["_bmad", "_bmad-output", ".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "BLE", "ARG", "TRY", "EM", "S"]

[tool.ruff.lint.per-file-ignores]
# The same rule set and test exemptions as l3io-wordpress-database, so the family lints
# alike. S101 asserts are the point of a test; S105-S107 flag the fake credentials a
# credential test must construct.
"tests/*" = ["S101", "S105", "S106", "S107", "ARG"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools"]
# AD-27: l3io.wp is a PEP 420 native namespace. mypy cannot infer the package root
# without these and will instead SUGGEST adding an __init__.py -- which would make
# this a regular package and render l3io-wordpress-database and l3io-wordpress-backup unimportable.
# Never take that suggestion.
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Test functions are not public surface, so they are type-checked but not
# required to carry annotations. Everything under src/ stays fully strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so the oracle and tools/ import the corpus as `tests.test_real_configs`,
# the same name mypy resolves it by.
pythonpath = ["."]
addopts = "--cov=l3io.wp.config --cov-report=term-missing"

# The floor sits just under the observed line coverage (94.72%), so a
# deleted test file fails CI instead of passing quietly. pytest-cov applies it
# to every run that measures coverage — a subset run must pass --no-cov.
[tool.coverage.report]
fail_under = 96.8
